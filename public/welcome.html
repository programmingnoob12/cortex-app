<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're in</title>
  <!-- Stripe sends people here the moment the payment clears. There is
       nothing to decide on this page, so it does not ask: it goes straight
       back to the app, which reads the fresh membership and opens the regime
       picker with everything unlocked. ?upgraded is what tells it to throw
       away this browser's cached "free" verdict.

       The redirect is a meta refresh with a script ahead of it so it also
       works with the address replaced rather than pushed, keeping Stripe's
       return URL out of the back button. The card below is only ever seen
       if both are unavailable. -->
  <meta http-equiv="refresh" content="0;url=https://cortex-game.vercel.app/?upgraded=1" />
  <script>
    try {
      window.location.replace("https://cortex-game.vercel.app/?upgraded=1");
    } catch (e) {
      window.location.href = "https://cortex-game.vercel.app/?upgraded=1";
    }
  </script>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #08090A;
      color: #F7F8F8;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    a { color: #4CB9D8; }
  </style>
</head>
<body>
  <p>
    You're in. <a href="https://cortex-game.vercel.app/?upgraded=1">Start training</a>
  </p>
</body>
</html>
