<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're in</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
    }
    .check {
      width: 56px;
      height: 56px;
      border-radius: 999px;
      background: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 12px;
    }
    p {
      color: #a1a1aa;
      line-height: 1.6;
      margin: 0 0 8px;
    }
    .start {
      display: block;
      margin: 28px 0 20px;
      padding: 16px 24px;
      border-radius: 10px;
      background: #4CB9D8;
      color: #06232B;
      font-size: 1.125rem;
      font-weight: 600;
      text-decoration: none;
    }
    .start:hover { filter: brightness(1.07); }
    .email-note {
      color: #d4d4d8;
      font-weight: 500;
      font-size: 0.9375rem;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">&#10003;</div>
    <h1>You're in</h1>
    <p>Your membership is active.</p>
    <!-- The page used to end here, which left everyone who had just paid
         with nowhere to go but their inbox. -->
    <a class="start" href="https://cortex-game.vercel.app">Start training</a>
    <p class="email-note">
      Already signed in on this device? That button takes you straight in.
    </p>
    <p>
      Otherwise, check your inbox for the sign-in link. Look in junk or spam
      if you don't see it.
    </p>
  </div>
</body>
</html>
