<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>You're in</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }
    .card {
      max-width: 420px;
    }
    .check {
      width: 56px;
      height: 56px;
      border-radius: 999px;
      background: #059669;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      font-size: 28px;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin: 0 0 12px;
    }
    p {
      color: #a1a1aa;
      line-height: 1.6;
      margin: 0 0 8px;
    }
    .email-note {
      color: #d4d4d8;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="check">✓</div>
    <h1>You're in</h1>
    <p>We've sent a sign-in link to your inbox — open it to get started.</p>
    <p class="email-note">Check your junk or spam folder if you don't see it.</p>
  </div>
</body>
</html>
